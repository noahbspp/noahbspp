<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body> 

<div class=".desktop-background">
<div class="icon-container">
  <img src="https://img.icons8.com/?size=100&id=iCwcOoy8tOGw&format=png&color=000000" alt="Folder" class="desktop-icon">
  <span class="icon-label">This PC</span>
</div>

<div class="icon-container">
  <img src="https://img.icons8.com/?size=100&id=WWogVNJDSfZ5&format=png&color=000000" alt="Folder" class="desktop-icon">
  <span class="icon-label">Private Stuff</span>
</div>

<div class="icon-container">
  <img src="https://img.icons8.com/?size=100&id=O9pZv9tHbizl&format=png&color=000000" alt="Folder" class="desktop-icon">
  <span class="icon-label">D:/Project Drive</span>
</div>
</div>


  <div class="blurred-bg"></div>
    <div class="terminal">
        <div class="window-bar"><button class="window-bar-buttton">&times;</button></div>
        <br>
        <div id="output" class="output"></div>
          <div class="input-container">
            <span class="prompt">user@terminal:~$</span>
            <input type="text" id="commandInput" class="input" autocomplete="off" >
            </div>
        </div>
    </div>
</div>

    <script src="scripts.js"></script>
</body>
</html>
